<div style="background:#0f1116;color:#e6e6e6;border-radius:14px;padding:22px;font-family:ui-sans-serif">
  <h3 style="margin:0 0 14px;font-size:16px">OAuth handshake</h3>
  <svg viewBox="0 0 600 320" style="width:100%">
    <text x="100" y="20" fill="#e6e6e6" font-size="12" text-anchor="middle">Browser</text>
    <text x="300" y="20" fill="#e6e6e6" font-size="12" text-anchor="middle">App</text>
    <text x="500" y="20" fill="#e6e6e6" font-size="12" text-anchor="middle">Auth</text>
    <line x1="100" y1="30" x2="100" y2="300" stroke="#333"/>
    <line x1="300" y1="30" x2="300" y2="300" stroke="#333"/>
    <line x1="500" y1="30" x2="500" y2="300" stroke="#333"/>
    <g data-bap-prompt="Explain: GET /login" style="cursor:pointer">
      <line x1="100" y1="80" x2="300" y2="80" stroke="#EC3B4A" stroke-width="2"/>
      <text x="200" y="74" fill="#EC3B4A" font-size="11" text-anchor="middle">GET /login</text>
    </g>
    <g data-bap-prompt="Explain: 302 redirect to /authorize" style="cursor:pointer">
      <line x1="300" y1="140" x2="500" y2="140" stroke="#EC3B4A" stroke-width="2"/>
      <text x="400" y="134" fill="#EC3B4A" font-size="11" text-anchor="middle">/authorize</text>
    </g>
    <g data-bap-prompt="Explain: 200 OK with token" style="cursor:pointer">
      <line x1="500" y1="200" x2="100" y2="200" stroke="#999" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="300" y="194" fill="#999" font-size="11" text-anchor="middle">200 OK + token</text>
    </g>
  </svg>
</div>
